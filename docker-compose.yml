# CAD browser demo for Dokploy / local Docker — no OCCT build on the host.
#
# Dokploy env (set once — never edit per release):
#   GITHUB_TOKEN=…              # Contents: Read
#   CAD_RELEASE_TAG=latest      # newest demo-v* with cad-demo-stage.tar.gz
#   CAD_RELEASE_PREFIX=demo-v
#
# After ./scripts/release-demo.sh --tag demo-v… : restart the container.
# Entrypoint re-resolves latest and re-fetches when the asset changes.
#
# Local:
#   export GITHUB_TOKEN=$(tr -d '\n' < ../github.cad.key)
#   docker network create dokploy-network 2>/dev/null || true
#   docker compose up -d --build
#
# Docs: docs/DEPLOY.md

services:
  cad:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: cad-demo:local
    restart: unless-stopped
    ports:
      - "${CAD_HOST_PORT:-8765}:8765"
    environment:
      PORT: "8765"
      HOST: "0.0.0.0"
      CACHE_MODE: release
      CAD_RELEASE_REPO: ${CAD_RELEASE_REPO:-NarendraPatwardhan/opencascade-bazel}
      CAD_RELEASE_TAG: ${CAD_RELEASE_TAG:-latest}
      CAD_RELEASE_PREFIX: ${CAD_RELEASE_PREFIX:-demo-v}
      CAD_RELEASE_ASSET: ${CAD_RELEASE_ASSET:-cad-demo-stage.tar.gz}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-${GH_TOKEN:-}}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true

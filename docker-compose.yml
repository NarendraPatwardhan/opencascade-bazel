# CAD browser demo for Dokploy / local Docker — no OCCT build on the host.
#
# Env:
#   CAD_RELEASE_URL  (default: demo-v0.1.0 GitHub Release asset)
#
# Local:
#   docker network create dokploy-network 2>/dev/null || true
#   docker compose up -d --build
#   open http://127.0.0.1:8765/
#
# Dokploy:
#   Domains → cad.opyt.cloud → service "cad" → container port 8765
#   Env CAD_RELEASE_URL as below (or use the default).
# Docs: docs/DEPLOY.md

services:
  cad:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: cad-demo:local
    restart: unless-stopped
    # Expose container port 8765. Traefik/Dokploy use this internal port.
    # Host bind is optional for local debugging (CAD_HOST_PORT=8765).
    ports:
      - "${CAD_HOST_PORT:-8765}:8765"
    environment:
      PORT: "8765"
      HOST: "0.0.0.0"
      CACHE_MODE: release
      CAD_RELEASE_URL: ${CAD_RELEASE_URL:-https://github.com/NarendraPatwardhan/opencascade-bazel/releases/download/demo-v0.1.0/cad-demo-stage.tar.gz}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - default
      - dokploy-network

networks:
  # Present on Dokploy hosts. Local: docker network create dokploy-network
  dokploy-network:
    external: true

# CAD browser demo for Dokploy / local Docker — no OCCT build on the host.
#
# Private GitHub repo: release assets must be fetched via the API with a token.
# Dokploy env (required):
#   GITHUB_TOKEN   — fine-grained PAT, Contents: Read (e.g. contents of ../github.cad.key)
#   CAD_RELEASE_TAG=demo-v0.1.0
#
# Local:
#   export GITHUB_TOKEN=$(tr -d '\n' < ../github.cad.key)
#   export CAD_RELEASE_TAG=demo-v0.1.0
#   docker network create dokploy-network 2>/dev/null || true
#   docker compose up -d --build
#
# Dokploy Domains: cad.opyt.cloud → service cad → port 8765
# Docs: docs/DEPLOY.md

services:
  cad:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: cad-demo:local
    restart: unless-stopped
    ports:
      - "${CAD_HOST_PORT:-8765}:8765"
    environment:
      PORT: "8765"
      HOST: "0.0.0.0"
      CACHE_MODE: release
      CAD_RELEASE_REPO: ${CAD_RELEASE_REPO:-NarendraPatwardhan/opencascade-bazel}
      # Prefer TAG + GITHUB_TOKEN (private repo). Public browser_download_url is 404.
      CAD_RELEASE_TAG: ${CAD_RELEASE_TAG:-demo-v0.3.0}
      CAD_RELEASE_ASSET: ${CAD_RELEASE_ASSET:-cad-demo-stage.tar.gz}
      # Optional; with token, entrypoint rewrites to API asset download by tag.
      CAD_RELEASE_URL: ${CAD_RELEASE_URL:-https://github.com/NarendraPatwardhan/opencascade-bazel/releases/download/demo-v0.3.0/cad-demo-stage.tar.gz}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-${GH_TOKEN:-}}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true

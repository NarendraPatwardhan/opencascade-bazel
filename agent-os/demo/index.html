<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>occ_c × AgentOS</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <strong>occ_c</strong>
        <span class="muted">× AgentOS</span>
      </div>
      <div class="actions">
        <button type="button" id="run" class="primary">Run</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel editor-panel">
        <h2>Luau</h2>
        <div
          id="editor"
          class="editor-host"
          role="textbox"
          aria-label="Luau source"
          aria-multiline="true"
        ></div>
        <pre id="log" class="log" aria-live="polite"></pre>
      </section>

      <section class="panel view-panel">
        <h2>View</h2>
        <div id="status" class="status">Starting…</div>
        <div
          id="viewport"
          class="viewport"
          role="img"
          aria-label="3D viewport"
        ></div>
        <pre id="meta" class="meta" hidden></pre>
      </section>

      <aside class="panel params-panel" aria-label="Parameters">
        <div id="params"></div>
      </aside>
    </main>

    <script type="module" src="/agent-os/src/main.js"></script>
  </body>
</html>

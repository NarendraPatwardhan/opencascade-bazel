<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>occ_c × AgentOS</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <span class="brand-mark">occ_c</span>
        <span class="brand-sep" aria-hidden="true">×</span>
        <span class="brand-sub">AgentOS</span>
      </div>
      <!-- Overleaf-style: compact version chip — opens local history drawer -->
      <button
        type="button"
        id="history-trigger"
        class="history-trigger"
        aria-haspopup="dialog"
        aria-controls="history-drawer"
        aria-expanded="false"
        title="Version history (local)"
      >
        <span class="history-trigger-icon" aria-hidden="true">⏱</span>
        <span class="history-trigger-label">History</span>
        <span id="history-trigger-tip" class="history-trigger-tip">Working copy</span>
      </button>
    </header>

    <main class="layout">
      <section class="panel editor-panel">
        <div class="panel-head">
          <h2 class="panel-title">Code</h2>
        </div>
        <div
          id="editor"
          class="editor-host"
          role="textbox"
          aria-label="Luau source"
          aria-multiline="true"
        ></div>
        <pre id="log" class="log" aria-live="polite" hidden></pre>
      </section>

      <section class="panel view-panel">
        <div class="panel-head">
          <h2 class="panel-title">View</h2>
          <div id="status" class="status" data-empty="1"></div>
        </div>
        <div
          id="viewport"
          class="viewport"
          role="img"
          aria-label="3D viewport"
        ></div>
        <pre id="meta" class="meta" hidden></pre>
      </section>

      <aside class="panel params-panel" aria-label="Parameters">
        <div id="params"></div>
      </aside>
    </main>

    <!-- Local versions drawer (closed by default — no permanent real estate) -->
    <div
      id="history-overlay"
      class="history-overlay"
      hidden
      aria-hidden="true"
    >
      <div class="history-overlay-backdrop" data-history-close tabindex="-1"></div>
      <aside
        id="history-drawer"
        class="history-drawer"
        role="dialog"
        aria-modal="true"
        aria-labelledby="history-drawer-title"
      >
        <div id="history" class="history-host"></div>
      </aside>
    </div>

    <script type="module" src="/agent-os/src/main.js"></script>
  </body>
</html>
